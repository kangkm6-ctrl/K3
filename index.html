--card);display:flex;align-items:center;gap:12px;padding:12px 14px;transition:transform .2s}.ico{width:38px;height:38px;border-radius:19px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}.it .mid{flex:1;min-width:0}.it .mid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .mid small{color:var(--sub);font-size:12px}.it .amt{font-weight:700;font-size:16px;white-space:nowrap}.empty{text-align:center;color:var(--sub);padding:40px 0;line-height:1.8}.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--pri2);color:#c4452a;font-weight:700;margin-top:12px;text-align:center}.btn.p{background:var(--pri);color:#fff}.btn.g{background:var(--card);color:var(--sub)}.card{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 2px 10px #0000000a}.card h3{margin:0 0 10px;font-size:15px}.bar2{margin:9px 0}.bar2 .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}.bar2 .t{height:9px;background:var(--pri2);border-radius:5px;overflow:hidden}.bar2 .t i{display:block;height:100%;background:var(--pri)}.trend{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}.trend div{flex:1;text-align:center;font-size:11px;color:var(--sub);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.trend i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}.trend div.cur i{background:var(--exp)}.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffffff0;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}.tabs button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}.tabs button span{font-size:21px}.tabs button.on{color:var(--pri);font-weight:700}.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:29px;background:var(--pri);color:#fff;font-size:32px;box-shadow:0 6px 16px #ff7a5977;z-index:6;display:flex;align-items:center;justify-content:center}.sheet-bg{position:fixed;inset:0;background:#0006;z-index:20;display:none}.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;z-index:21;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:none}.sheet.on,.sheet-bg.on{display:block}.seg{display:flex;background:var(--pri2);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:#c4452a}.seg button.on{background:#fff;box-shadow:0 1px 4px #0002}.f{margin:12px 0 4px;font-size:12.5px;color:var(--sub)}.amtin{width:100%;font-size:30px;font-weight:800;border:0;border-bottom:2px solid var(--pri);background:transparent;padding:6px 2px;outline:0;text-align:right}.in2{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:0}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{padding:8px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:14px}.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}.chk input{width:20px;height:20px;accent-color:var(--pri)}.rr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.rr:last-child{border:0}.rr small{color:var(--sub);display:block}.x{color:var(--exp);padding:6px 10px}.gseg{display:flex;background:var(--pri2);border-radius:12px;padding:3px;margin-bottom:10px}.gseg button{flex:1;padding:8px;border-radius:10px;font-weight:700;color:#c4452a}.gseg button.on{background:#fff;box-shadow:0 1px 4px #0002}.gc{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line)}.gc .g{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}.gc .g i{display:block;width:42%;max-width:14px;border-radius:4px 4px 0 0;min-height:1px}.gc .g i.a{background:var(--inc)}.gc .g i.b{background:var(--pri)}.gl{display:flex;gap:4px;font-size:11px;color:var(--sub);text-align:center;margin-top:4px}.gl span{flex:1}.gl span.cur{color:var(--exp);font-weight:800}.lg{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-bottom:6px}.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cg .cd{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 2px;line-height:1.2;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cg .cd.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}.inst{display:flex;align-items:center;gap:8px;margin-top:10px}.inst button,.inst .ib{padding:8px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:4px}.inst .on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}.inst .ib input{width:3ch;border:0;border-bottom:1px solid var(--sub);background:transparent;text-align:center;font-size:16px;font-weight:700;outline:0;padding:0;color:inherit;border-radius:0}.inst .ib.on input{border-bottom-color:#fff}.cn{width:100%;min-width:0;padding:4px 2px;border-radius:10px;border:1px solid var(--pri);text-align:center;font-size:13px;outline:0;background:#fff}.chips .ip{border-color:var(--pri);color:#c4452a;background:var(--pri2)}.chips .ip.on{background:var(--pri);color:#fff}.lk{color:var(--pri);font-weight:700;font-size:12.5px;margin-left:8px;padding:2px 6px}.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#3a2f2bdd;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;display:none}textarea.in2{height:90px;font-size:12px}</ <body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" aria-label="추가">+</button>
<nav class="tabs" id="tabs">
 <button data-t="list" class="on"><span>📒</span>내역</button>
 <button data-t="stat"><span>📊</span>통계</button>
 <button data-t="set"><span>⚙️</span>설정</button>
</nav>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
const EC=[['식비','🍚'],['카페·간식','☕'],['생활용품','🧴'],['교통','🚌'],['주거·관리비','🏠'],['통신','📱'],['의료','💊'],['교육','📚'],['의류·미용','👗'],['문화·여가','🎬'],['경조사','🎁'],['기타','📦']];
const IC=[['월급','💰'],['용돈','🧧'],['부수입','✨'],['기타수입','📥']];
const cards=()=>S.cards&&S.cards.length===5?S.cards:[1,2,3,4,5].map(i=>'카드'+i);
const isCard=p=>/^c[1-5]$/.test(p||'')||p==='카드';
const pname=p=>{const m=/^c([1-5])$/.exec(p||'');return m?cards()[m[1]-1]:p};
const snap=p=>/^c[1-5]$/.test(p||'')?pname(p):undefined;
const mig=()=>{let c=0;S.tx.forEach(x=>{if(!x.pn&&/^c[1-5]$/.test(x.p||'')){x.pn=pname(x.p);c=1}});return c};
const KEY='gagyebu_v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tx)S={tx:[],rec:[],budget:0,applied:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 실패: 저장공간을 확인하세요')}};
const $=s=>document.querySelector(s);
const won=n=>Math.round(n).toLocaleString('ko-KR');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cat=(t,c)=>(t==='i'?IC:EC).find(x=>x[0]===c)||['기타','📦'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const VER='2026-11-15';
const GK='gagyebu_gh';let G={};try{G=JSON.parse(localStorage.getItem(GK))||{}}catch(e){}
const DEF={o:'kangkm6-ctrl',r:'gagyebu-backup'};
const gsave=()=>{try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}};
const b64=t=>btoa(unescape(encodeURIComponent(t))),unb64=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,''))));
const hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+':'+h};
const gurl=()=>`https://api.github.com/repos/${G.o}/${G.r}/contents/gagyebu-backup.json`;
const ghd=()=>({'Authorization':'Bearer '+G.t,'Accept':'application/vnd.github+json'});
function gstat(){const e=document.getElementById('ghst');if(!e)return;e.textContent=G.err?'⚠️ '+G.err:G.last?'✅ 마지막 백업: '+G.last:'아직 백업 전이에요';e.style.color=G.err?'#e8553d':''}
let busy=0;
async function ghBackup(manual){
if(!G.o||!G.r||!G.t||busy)return;
if(!manual&&!S.tx.length&&!S.rec.length)return;
const data=JSON.stringify(S),h=hsh(data);
if(!manual&&G.h===h)return;
busy=1;
try{
const g=await fetch(gurl(),{headers:ghd(),cache:'no-store'});
let sha;if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw g;
const n=new Date(),ts=ymd(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes());
const p=await fetch(gurl(),{method:'PUT',headers:ghd(),body:JSON.stringify({message:'backup '+ts,content:b64(data),sha})});
if(!p.ok)throw p;
G.h=h;G.last=ts;G.err='';gsave();if(manual)toast('GitHub에 백업했어요');
}catch(e){
const c=e&&e.status;G.err=c===401?'토큰이 올바르지 않아요':c===403?'토큰 권한이 부족해요 (Contents 읽기/쓰기 필요)':c===404?'저장소를 찾을 수 없어요 (이름·토큰 권한 확인)':'네트워크 오류, 다음에 다시 시도해요';
gsave();if(manual)toast('백업 실패');
}
busy=0;gstat();
}
let cur=new Date();cur.setDate(1);
let tab='list',sm='m',ghOpen=false,wpOpen=false;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
function eff(){const o=[];S.tx.forEach(x=>{const n=x.t==='e'&&x.i>1?x.i:1;if(n===1){o.push(x);return}
const y=+x.d.slice(0,4),m=+x.d.slice(5,7)-1,d=+x.d.slice(8),b=Math.floor(x.a/n);
for(let j=0;j<n;j++){const l=new Date(y,m+j+1,0).getDate(),t=new Date(y,m+j,1);
o.push({...x,d:ymd(new Date(t.getFullYear(),t.getMonth(),Math.min(d,l))),a:j===n-1?x.a-b*(n-1):b,ins:{n:j+1,of:n,total:x.a}})}});return o}
function monthTx(k){return eff().filter(x=>x.d.startsWith(k))}
function sums(arr){let i=0,e=0;arr.forEach(x=>x.t==='i'?i+=x.a:e+=x.a);return{i,e}}
function render(){
$('#fab').style.display=tab==='set'?'none':'flex';
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
const k=mk(cur);
let h='';
if(tab!=='set')h+=`<div class="mhead"><button id="pv">‹</button><b>${cur.getFullYear()}년 ${cur.getMonth()+1}월</b><button id="nx">›</button></div>`;
if(tab==='list')h+=vList(k);else if(tab==='stat')h+=vStat(k);else h+=vSet();
$('#app').innerHTML=h;
bind(k);
}
function vList(k){
const arr=monthTx(k),{i,e}=sums(arr);
let h=`<div class="sum"><div class="row"><span>수입</span><span class="inc">${won(i)}원</span></div><div class="row"><span>지출</span><span class="exp">${won(e)}원</span></div><div class="row big"><span style="color:var(--ink)">남은 돈</span><span class="${i-e<0?'exp':'inc'}">${won(i-e)}원</span></div>`;
if(S.budget>0){const p=Math.min(100,e/S.budget*100);h+=`<div class="bud"><div class="bar"><i class="${e>S.budget?'over':''}" style="width:${p}%"></i></div><small><span>이번 달 예산 ${won(S.budget)}원</span><span>${e>S.budget?won(e-S.budget)+'원 초과':won(S.budget-e)+'원 남음'}</span></small></div>`}
h+='</div>';
const pend=S.rec.filter(r=>!(S.applied[k]||[]).includes(r.id));
if(pend.length)h+=`<button class="btn" id="applyrec">🔁 고정항목 ${pend.length}건 이번 달에 넣기</button>`;
if(!arr.length)h+=`<div class="empty">아직 기록이 없어요<br>오른쪽 아래 + 버튼으로 시작해요 🙂</div>`;
const days={};arr.forEach(x=>(days[x.d]=days[x.d]||[]).push(x));
Object.keys(days).sort().reverse().forEach(d=>{
const dt=new Date(d+'T00:00:00'),ds=sums(days[d]);
h+=`<div class="day"><div class="dh"><span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${'일월화수목금토'[dt.getDay()]})</span><span>${ds.i?'+'+won(ds.i)+' ':''}${ds.e?'-'+won(ds.e):''}</span></div>`;
days[d].slice().reverse().forEach(x=>{
const c=cat(x.t,x.c);
h+=`<div class="it" data-id="${x.id}"><div class="del" data-del="${x.id}">삭제</div><div class="in"><div class="ico">${c[1]}</div><div class="mid"><b>${esc(x.m)||x.c}</b><small>${x.c} · ${x.t==='i'?'수입':(x.pn||pname(x.p))}${x.ins?' · 할부 '+x.ins.n+'/'+x.ins.of+'회 (총 '+won(x.ins.total)+')':''}${x.r?' · 🔁':''}</small></div><div class="amt ${x.t==='i'?'inc':'exp'}">${x.t==='i'?'+':'-'}${won(x.a)}</div></div></div>`;
});
h+='</div>';
});
return h;
}
function vStat(k){
const arr=monthTx(k).filter(x=>x.t==='e'),tot=arr.reduce((a,x)=>a+x.a,0);
let h='<div class="card"><h3>분류별 지출</h3>';
if(!tot)h+='<div class="empty" style="padding:16px">지출 기록이 없어요</div>';
const by={};arr.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
Object.entries(by).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{h+=`<div class="bar2"><div class="l"><span>${cat('e',c)[1]} ${c}</span><span>${won(v)}원 · ${Math.round(v/tot*100)}%</span></div><div class="t"><i style="width:${v/tot*100}%"></i></div></div>`});
h+='</div>';
if(tot){
h+='<div class="card"><h3>결제수단별</h3>';
const pm={};arr.forEach(x=>{const k=x.pn||(x.p==='카드'?'카드(구분 전)':pname(x.p))||'기타';pm[k]=(pm[k]||0)+x.a});Object.entries(pm).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>h+=`<div class="rr"><span>${esc(k)}</span><b>${won(v)}원</b></div>`);
h+='</div>';
}
const ms=[];for(let n=5;n>=0;n--){const d=new Date(cur.getFullYear(),cur.getMonth()-n,1);ms.push([d.getMonth()+1,sums(monthTx(mk(d))).e,n===0])}
const mx=Math.max(1,...ms.map(m=>m[1]));
h+='<div class="card"><h3>최근 6개월 지출</h3><div class="trend">'+ms.map(m=>`<div class="${m[2]?'cur':''}"><span>${m[1]?Math.round(m[1]/10000)+'만':''}</span><i style="height:${m[1]/mx*80}px"></i><span>${m[0]}월</span></div>`).join('')+'</div></div>';
h+=vDiag();
return h;
}
function vDiag(){
const y=cur.getFullYear();let rows=[];
if(sm==='m'){for(let n=0;n<12;n++){const q=sums(monthTx(y+'-'+pad(n+1)));rows.push({l:(n+1)+'월',i:q.i,e:q.e,c:n===cur.getMonth()})}}
else{const E=eff(),ys=[...new Set(E.map(x=>+x.d.slice(0,4)))];if(!ys.includes(y))ys.push(y);ys.sort();
ys.forEach(Y=>{const q=sums(E.filter(x=>x.d.startsWith(Y+'-')));rows.push({l:Y+'년',i:q.i,e:q.e,c:Y===y})})}
const mx=Math.max(1,...rows.map(r=>Math.max(r.i,r.e))),T=rows.reduce((a,r)=>({i:a.i+r.i,e:a.e+r.e}),{i:0,e:0});
let h=`<div class="card"><h3>${sm==='m'?y+'년 월통계':'년통계'}</h3><div class="gseg"><button data-sm="m" class="${sm==='m'?'on':''}">월통계</button><button data-sm="y" class="${sm==='y'?'on':''}">년통계</button></div>
<div class="lg"><span><b style="background:var(--inc)"></b>수입</span><span><b style="background:var(--pri)"></b>지출</span></div>
<div class="gc">${rows.map(r=>`<div class="g"><i class="a" style="height:${r.i/mx*100}%"></i><i class="b" style="height:${r.e/mx*100}%"></i></div>`).join('')}</div>
<div class="gl">${rows.map(r=>`<span class="${r.c?'cur':''}">${r.l}</span>`).join('')}</div><div style="margin-top:10px">`;
rows.slice().reverse().forEach(r=>{if(!r.i&&!r.e)return;const d=r.i-r.e;h+=`<div class="rr"><div>${r.l}<small>수입 ${won(r.i)} · 지출 ${won(r.e)}</small></div><b class="${d<0?'exp':'inc'}">${d>=0?'+':''}${won(d)}</b></div>`});
