<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff7f3">
<title>우리 가계부</title>
<link rel="apple-touch-icon" id="ic">
<style>
:root{--bg:#fff7f3;--card:#fff;--ink:#3a2f2b;--sub:#9a8a82;--pri:#ff7a59;--pri2:#ffe3d9;--exp:#e8553d;--inc:#2f8f6b;--line:#f1e4dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.mhead{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px 0 8px}
.mhead b{font-size:20px;min-width:140px;text-align:center}
.mhead button{font-size:22px;width:40px;height:40px;border-radius:20px;background:var(--card)}
.sum{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 10px #0000000a}
.sum .row{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}
.sum .row span:first-child{color:var(--sub)}
.sum .big{font-size:24px;font-weight:800;padding-top:10px;margin-top:6px;border-top:1px dashed var(--line)}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.bud{margin-top:12px}.bud .bar{height:10px;background:var(--pri2);border-radius:5px;overflow:hidden}
.bud .bar i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bud .bar i.over{background:var(--exp)}
.bud small{display:flex;justify-content:space-between;color:var(--sub);margin-top:5px;font-size:12.5px}
.day{margin-top:16px}
.dh{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:0 4px 6px}
.it{position:relative;overflow:hidden;background:var(--card);border-radius:14px;margin-bottom:6px}
.it .del{visibility:hidden;position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--exp);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.it .in{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:12px 14px;transition:transform .2s}
.ico{width:38px;height:38px;border-radius:19px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.it .mid{flex:1;min-width:0}.it .mid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mid small{color:var(--sub);font-size:12px}
.it .amt{font-weight:700;font-size:16px;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:40px 0;line-height:1.8}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--pri2);color:#c4452a;font-weight:700;margin-top:12px;text-align:center}
.btn.p{background:var(--pri);color:#fff}
.btn.g{background:var(--card);color:var(--sub)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 2px 10px #0000000a}
.card h3{margin:0 0 10px;font-size:15px}
.bar2{margin:9px 0}.bar2 .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar2 .t{height:9px;background:var(--pri2);border-radius:5px;overflow:hidden}.bar2 .t i{display:block;height:100%;background:var(--pri)}
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.trend div{flex:1;text-align:center;font-size:11px;color:var(--sub);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.trend i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.trend div.cur i{background:var(--exp)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffffff0;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:21px}.tabs button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:29px;background:var(--pri);color:#fff;font-size:32px;box-shadow:0 6px 16px #ff7a5977;z-index:6;display:flex;align-items:center;justify-content:center}
.sheet-bg{position:fixed;inset:0;background:#0006;z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;z-index:21;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:none}
.sheet.on,.sheet-bg.on{display:block}
.seg{display:flex;background:var(--pri2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:#c4452a}
.seg button.on{background:#fff;box-shadow:0 1px 4px #0002}
.f{margin:12px 0 4px;font-size:12.5px;color:var(--sub)}
.amtin{width:100%;font-size:30px;font-weight:800;border:0;border-bottom:2px solid var(--pri);background:transparent;padding:6px 2px;outline:0;text-align:right}
.in2{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:8px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:14px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--pri)}
.rr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rr:last-child{border:0}.rr small{color:var(--sub);display:block}
.x{color:var(--exp);padding:6px 10px}
.gseg{display:flex;background:var(--pri2);border-radius:12px;padding:3px;margin-bottom:10px}
.gseg button{flex:1;padding:8px;border-radius:10px;font-weight:700;color:#c4452a}
.gseg button.on{background:#fff;box-shadow:0 1px 4px #0002}
.gc{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line)}
.gc .g{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.gc .g i{display:block;width:42%;max-width:14px;border-radius:4px 4px 0 0;min-height:1px}
.gc .g i.a{background:var(--inc)}.gc .g i.b{background:var(--pri)}
.gl{display:flex;gap:4px;font-size:11px;color:var(--sub);text-align:center;margin-top:4px}.gl span{flex:1}
.gl span.cur{color:var(--exp);font-weight:800}
.lg{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-bottom:6px}
.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#3a2f2bdd;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;display:none}
textarea.in2{height:90px;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" aria-label="추가">+</button>
<nav class="tabs" id="tabs">
 <button data-t="list" class="on"><span>📒</span>내역</button>
 <button data-t="stat"><span>📊</span>통계</button>
 <button data-t="set"><span>⚙️</span>설정</button>
</nav>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
const EC=[['식비','🍚'],['카페·간식','☕'],['생활용품','🧴'],['교통','🚌'],['주거·관리비','🏠'],['통신','📱'],['의료','💊'],['교육','📚'],['의류·미용','👗'],['문화·여가','🎬'],['경조사','🎁'],['기타','📦']];
const IC=[['월급','💰'],['용돈','🧧'],['부수입','✨'],['기타수입','📥']];
const PM=['카드','현금','계좌'];
const KEY='gagyebu_v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tx)S={tx:[],rec:[],budget:0,applied:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 실패: 저장공간을 확인하세요')}};
const $=s=>document.querySelector(s);
const won=n=>Math.round(n).toLocaleString('ko-KR');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cat=(t,c)=>(t==='i'?IC:EC).find(x=>x[0]===c)||['기타','📦'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let cur=new Date();cur.setDate(1);
let tab='list',sm='m';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
function monthTx(k){return S.tx.filter(x=>x.d.startsWith(k))}
function sums(arr){let i=0,e=0;arr.forEach(x=>x.t==='i'?i+=x.a:e+=x.a);return{i,e}}

function render(){
  $('#fab').style.display=tab==='set'?'none':'flex';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const k=mk(cur);
  let h='';
  if(tab!=='set')h+=`<div class="mhead"><button id="pv">‹</button><b>${cur.getFullYear()}년 ${cur.getMonth()+1}월</b><button id="nx">›</button></div>`;
  if(tab==='list')h+=vList(k);else if(tab==='stat')h+=vStat(k);else h+=vSet();
  $('#app').innerHTML=h;
  bind(k);
}
function vList(k){
  const arr=monthTx(k),{i,e}=sums(arr);
  let h=`<div class="sum"><div class="row"><span>수입</span><span class="inc">${won(i)}원</span></div><div class="row"><span>지출</span><span class="exp">${won(e)}원</span></div><div class="row big"><span style="color:var(--ink)">남은 돈</span><span class="${i-e<0?'exp':'inc'}">${won(i-e)}원</span></div>`;
  if(S.budget>0){const p=Math.min(100,e/S.budget*100);h+=`<div class="bud"><div class="bar"><i class="${e>S.budget?'over':''}" style="width:${p}%"></i></div><small><span>이번 달 예산 ${won(S.budget)}원</span><span>${e>S.budget?won(e-S.budget)+'원 초과':won(S.budget-e)+'원 남음'}</span></small></div>`}
  h+='</div>';
  const pend=S.rec.filter(r=>!(S.applied[k]||[]).includes(r.id));
  if(pend.length)h+=`<button class="btn" id="applyrec">🔁 고정항목 ${pend.length}건 이번 달에 넣기</button>`;
  if(!arr.length)h+=`<div class="empty">아직 기록이 없어요<br>오른쪽 아래 + 버튼으로 시작해요 🙂</div>`;
  const days={};arr.forEach(x=>(days[x.d]=days[x.d]||[]).push(x));
  Object.keys(days).sort().reverse().forEach(d=>{
    const dt=new Date(d+'T00:00:00'),ds=sums(days[d]);
    h+=`<div class="day"><div class="dh"><span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${'일월화수목금토'[dt.getDay()]})</span><span>${ds.i?'+'+won(ds.i)+' ':''}${ds.e?'-'+won(ds.e):''}</span></div>`;
    days[d].slice().reverse().forEach(x=>{
      const c=cat(x.t,x.c);
      h+=`<div class="it" data-id="${x.id}"><div class="del" data-del="${x.id}">삭제</div><div class="in"><div class="ico">${c[1]}</div><div class="mid"><b>${esc(x.m)||x.c}</b><small>${x.c} · ${x.t==='i'?'수입':x.p}${x.r?' · 🔁':''}</small></div><div class="amt ${x.t==='i'?'inc':'exp'}">${x.t==='i'?'+':'-'}${won(x.a)}</div></div></div>`;
    });
    h+='</div>';
  });
  return h;
}
function vStat(k){
  const arr=monthTx(k).filter(x=>x.t==='e'),tot=arr.reduce((a,x)=>a+x.a,0);
  let h='<div class="card"><h3>분류별 지출</h3>';
  if(!tot)h+='<div class="empty" style="padding:16px">지출 기록이 없어요</div>';
  const by={};arr.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  Object.entries(by).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{h+=`<div class="bar2"><div class="l"><span>${cat('e',c)[1]} ${c}</span><span>${won(v)}원 · ${Math.round(v/tot*100)}%</span></div><div class="t"><i style="width:${v/tot*100}%"></i></div></div>`});
  h+='</div>';
  if(tot){
    h+='<div class="card"><h3>결제수단별</h3>';
    PM.forEach(p=>{const v=arr.filter(x=>x.p===p).reduce((a,x)=>a+x.a,0);if(v)h+=`<div class="rr"><span>${p}</span><b>${won(v)}원</b></div>`});
    h+='</div>';
  }
  const ms=[];for(let n=5;n>=0;n--){const d=new Date(cur.getFullYear(),cur.getMonth()-n,1);ms.push([d.getMonth()+1,sums(monthTx(mk(d))).e,n===0])}
  const mx=Math.max(1,...ms.map(m=>m[1]));
  h+='<div class="card"><h3>최근 6개월 지출</h3><div class="trend">'+ms.map(m=>`<div class="${m[2]?'cur':''}"><span>${m[1]?Math.round(m[1]/10000)+'만':''}</span><i style="height:${m[1]/mx*80}px"></i><span>${m[0]}월</span></div>`).join('')+'</div></div>';
  h+=vDiag();
  return h;
}
function vDiag(){
  const y=cur.getFullYear();let rows=[];
  if(sm==='m'){for(let n=0;n<12;n++){const q=sums(monthTx(y+'-'+pad(n+1)));rows.push({l:(n+1)+'월',i:q.i,e:q.e,c:n===cur.getMonth()})}}
  else{const ys=[...new Set(S.tx.map(x=>+x.d.slice(0,4)))];if(!ys.includes(y))ys.push(y);ys.sort();
    ys.forEach(Y=>{const q=sums(S.tx.filter(x=>x.d.startsWith(Y+'-')));rows.push({l:Y+'년',i:q.i,e:q.e,c:Y===y})})}
  const mx=Math.max(1,...rows.map(r=>Math.max(r.i,r.e))),T=rows.reduce((a,r)=>({i:a.i+r.i,e:a.e+r.e}),{i:0,e:0});
  let h=`<div class="card"><h3>${sm==='m'?y+'년 월통계':'년통계'}</h3><div class="gseg"><button data-sm="m" class="${sm==='m'?'on':''}">월통계</button><button data-sm="y" class="${sm==='y'?'on':''}">년통계</button></div>
  <div class="lg"><span><b style="background:var(--inc)"></b>수입</span><span><b style="background:var(--pri)"></b>지출</span></div>
  <div class="gc">${rows.map(r=>`<div class="g"><i class="a" style="height:${r.i/mx*100}%"></i><i class="b" style="height:${r.e/mx*100}%"></i></div>`).join('')}</div>
  <div class="gl">${rows.map(r=>`<span class="${r.c?'cur':''}">${r.l}</span>`).join('')}</div><div style="margin-top:10px">`;
  rows.slice().reverse().forEach(r=>{if(!r.i&&!r.e)return;const d=r.i-r.e;h+=`<div class="rr"><div>${r.l}<small>수입 ${won(r.i)} · 지출 ${won(r.e)}</small></div><b class="${d<0?'exp':'inc'}">${d>=0?'+':''}${won(d)}</b></div>`});
  h+=`<div class="rr"><div><b>합계</b><small>수입 ${won(T.i)} · 지출 ${won(T.e)}</small></div><b class="${T.i-T.e<0?'exp':'inc'}">${T.i-T.e>=0?'+':''}${won(T.i-T.e)}</b></div></div></div>`;
  return h;
}
function vSet(){
  let h=`<div class="mhead"><b>설정</b></div><div class="card"><h3>월 예산</h3><input class="in2" id="bud" inputmode="numeric" placeholder="예: 2,000,000 (0이면 사용 안 함)" value="${S.budget?won(S.budget):''}"><button class="btn p" id="budsave">저장</button></div>`;
  h+='<div class="card"><h3>고정항목 (매월 반복)</h3>';
  if(!S.rec.length)h+='<div style="color:var(--sub);font-size:14px">월세·통신비·보험료처럼 매달 나가는 돈을 등록해두면 한 번에 넣을 수 있어요. 등록은 + 버튼에서 “매월 반복”을 체크하세요.</div>';
  S.rec.forEach(r=>h+=`<div class="rr"><div>${cat(r.t,r.c)[1]} ${esc(r.m)||r.c}<small>매월 ${r.day}일 · ${r.t==='i'?'수입':r.p}</small></div><div>${won(r.a)}원 <button class="x" data-rd="${r.id}">✕</button></div></div>`);
  h+='</div>';
  h+=`<div class="card"><h3>백업 / 복원</h3><div style="color:var(--sub);font-size:13px;line-height:1.6">기록은 이 기기(Safari)에만 저장돼요. 가끔 백업해두면 폰을 바꿔도 안전해요.</div><button class="btn p" id="exp">백업 파일 저장</button><button class="btn" id="expx">엑셀(CSV)로 내보내기</button><button class="btn g" id="imp">백업 불러오기</button><input type="file" id="file" accept=".json,application/json" style="display:none"></div>`;
  h+=`<div class="card"><h3>전체 삭제</h3><button class="btn g" id="wipe">모든 기록 지우기</button></div>`;
  return h;
}
function bind(k){
  const pv=$('#pv');if(pv){pv.onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};$('#nx').onclick=()=>{cur.setMonth(cur.getMonth()+1);render()}}
  document.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{sm=b.dataset.sm;const y=scrollY;render();scrollTo(0,y)});
  const ar=$('#applyrec');if(ar)ar.onclick=()=>{
    const ap=S.applied[k]=S.applied[k]||[];
    S.rec.forEach(r=>{if(ap.includes(r.id))return;const last=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
      S.tx.push({id:uid(),d:k+'-'+pad(Math.min(r.day,last)),t:r.t,a:r.a,c:r.c,p:r.p,m:r.m,r:1});ap.push(r.id)});
    save();render();toast('고정항목을 넣었어요')};
  document.querySelectorAll('.it').forEach(el=>swipe(el));
  document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{S.rec=S.rec.filter(r=>r.id!==b.dataset.rd);save();render()});
  const bs=$('#budsave');if(bs)bs.onclick=()=>{S.budget=parseInt(($('#bud').value||'0').replace(/\D/g,''))||0;save();toast('저장했어요');render()};
  bindNum($('#bud'));
  const ex=$('#exp');if(ex){
    ex.onclick=()=>dl('gagyebu-backup-'+ymd(new Date())+'.json',JSON.stringify(S),'application/json');
    $('#expx').onclick=()=>{let c='﻿날짜,구분,분류,결제수단,내용,금액\n';S.tx.slice().sort((a,b)=>a.d<b.d?-1:1).forEach(x=>c+=[x.d,x.t==='i'?'수입':'지출',x.c,x.t==='i'?'':x.p,'"'+String(x.m||'').replace(/"/g,'""')+'"',x.a].join(',')+'\n');dl('gagyebu.csv',c,'text/csv')};
    $('#imp').onclick=()=>$('#file').click();
    $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx)throw 0;S=d;S.rec=S.rec||[];S.applied=S.applied||{};save();toast('불러왔어요');render()}catch(x){toast('올바른 백업 파일이 아니에요')}};r.readAsText(f)};
    let w=0;$('#wipe').onclick=function(){if(!w){w=1;this.textContent='정말 지울까요? 한 번 더 누르세요';this.style.color='#e8553d';setTimeout(()=>{w=0;this.textContent='모든 기록 지우기';this.style.color=''},3000)}else{S={tx:[],rec:[],budget:0,applied:{}};save();render();toast('모두 지웠어요')}};
  }
}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function bindNum(el){if(!el)return;el.oninput=()=>{const v=el.value.replace(/\D/g,'');el.value=v?won(+v):''}}
function swipe(el){
  const inn=el.querySelector('.in');let x0=0,y0=0,dx=0,mv=false,open=false;
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;mv=false;inn.style.transition='none'},{passive:true});
  el.addEventListener('touchmove',e=>{const a=e.touches[0].clientX-x0,b=e.touches[0].clientY-y0;if(!mv&&Math.abs(b)>Math.abs(a))return;if(Math.abs(a)>8)mv=true;if(mv){el.querySelector('.del').style.visibility='visible';dx=Math.max(-80,Math.min(0,a+(open?-80:0)));inn.style.transform=`translateX(${dx}px)`}},{passive:true});
  el.addEventListener('touchend',()=>{inn.style.transition='';if(mv){open=dx<-40;inn.style.transform=open?'translateX(-80px)':'';if(!open)setTimeout(()=>el.querySelector('.del').style.visibility='',200)}});
  inn.onclick=()=>{if(mv){mv=false;return}if(open){open=false;inn.style.transform='';setTimeout(()=>el.querySelector('.del').style.visibility='',200);return}openSheet(S.tx.find(t=>t.id===el.dataset.id))};
  el.querySelector('.del').onclick=()=>{S.tx=S.tx.filter(t=>t.id!==el.dataset.id);save();render();toast('삭제했어요')};
}
function openSheet(tx){
  const ed=!!tx;
  const f=tx?{...tx}:{t:'e',a:0,c:'식비',p:'카드',m:'',d:ymd(new Date().getMonth()===cur.getMonth()&&new Date().getFullYear()===cur.getFullYear()?new Date():cur),r:0};
  const sh=$('#sheet');
  function draw(){
    const cats=f.t==='i'?IC:EC;
    sh.innerHTML=`<div class="seg"><button data-t="e" class="${f.t==='e'?'on':''}">지출</button><button data-t="i" class="${f.t==='i'?'on':''}">수입</button></div>
    <div class="f">금액</div><input class="amtin" id="a" inputmode="numeric" placeholder="0" value="${f.a?won(f.a):''}">
    <div class="f">날짜</div><input class="in2" type="date" id="d" value="${f.d}">
    <div class="f">분류</div><div class="chips" id="cs">${cats.map(c=>`<button data-c="${c[0]}" class="${f.c===c[0]?'on':''}">${c[1]} ${c[0]}</button>`).join('')}</div>
    ${f.t==='e'?`<div class="f">결제수단</div><div class="chips" id="ps">${PM.map(p=>`<button data-p="${p}" class="${f.p===p?'on':''}">${p}</button>`).join('')}</div>`:''}
    <div class="f">내용 (선택)</div><input class="in2" id="m" placeholder="예: 마트 장보기" value="${esc(f.m)}">
    ${ed?'':`<label class="chk"><input type="checkbox" id="rc"> 매월 반복 (고정항목으로도 등록)</label>`}
    <button class="btn p" id="ok">${ed?'수정 완료':'저장'}</button>
    ${ed?'<button class="btn g" id="rm">삭제</button>':''}
    <button class="btn g" id="cl">닫기</button>`;
    bindNum($('#a'));
    sh.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{keep();f.t=b.dataset.t;f.c=f.t==='i'?'월급':'식비';draw()});
    sh.querySelectorAll('#cs button').forEach(b=>b.onclick=()=>{keep();f.c=b.dataset.c;draw()});
    sh.querySelectorAll('#ps button').forEach(b=>b.onclick=()=>{keep();f.p=b.dataset.p;draw()});
    $('#cl').onclick=close;
    if(ed){let w=0;$('#rm').onclick=function(){if(!w){w=1;this.textContent='한 번 더 누르면 삭제돼요';this.style.color='#e8553d'}else{S.tx=S.tx.filter(t=>t.id!==tx.id);save();close();render();toast('삭제했어요')}}}
    $('#ok').onclick=()=>{
      keep();
      if(!f.a){toast('금액을 입력해주세요');return}
      if(!f.d){toast('날짜를 선택해주세요');return}
      if(ed){Object.assign(tx,{t:f.t,a:f.a,c:f.c,p:f.t==='i'?'':f.p,m:f.m,d:f.d})}
      else{
        const rc=$('#rc')&&$('#rc').checked,row={id:uid(),d:f.d,t:f.t,a:f.a,c:f.c,p:f.t==='i'?'':f.p,m:f.m,r:rc?1:0};
        S.tx.push(row);
        if(rc){const rid=uid();S.rec.push({id:rid,t:f.t,a:f.a,c:f.c,p:row.p,m:f.m,day:+f.d.slice(8)});const k=f.d.slice(0,7);(S.applied[k]=S.applied[k]||[]).push(rid)}
      }
      save();
      const k=f.d.slice(0,7);cur=new Date(+k.slice(0,4),+k.slice(5)-1,1);
      close();tab='list';render();toast('저장했어요');
    };
  }
  function keep(){const a=$('#a');if(a)f.a=parseInt(a.value.replace(/\D/g,''))||0;const d=$('#d');if(d)f.d=d.value;const m=$('#m');if(m)f.m=m.value}
  draw();$('#bg').classList.add('on');sh.classList.add('on');
  if(!ed)setTimeout(()=>{try{$('#a').focus()}catch(e){}},50);
}
function close(){$('#bg').classList.remove('on');$('#sheet').classList.remove('on')}
$('#bg').onclick=close;
